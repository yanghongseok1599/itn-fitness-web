<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN 피트니스 — 맞춤 운동 루틴 생성</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f0f2f5; color: #2a2a2a; min-height: 100vh; }

  .top-bar { background: #1e3a5f; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .top-bar .logo { font-size: 20px; font-weight: 900; }
  .top-bar .logo span { color: #f0a060; }
  .top-bar .sub { font-size: 12px; color: #a0bcd8; }

  .container { max-width: 860px; margin: 28px auto; padding: 0 16px 60px; }

  .card { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; overflow: hidden; }
  .card-header { background: #1e4d7b; color: white; padding: 12px 20px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 20px; }

  .step-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #f0a060; color: #1e3a5f; border-radius: 50%; font-size: 12px; font-weight: 900; }

  .upload-area { border: 2px dashed #c2d3e5; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; background: #f8fafc; }
  .upload-area:hover, .upload-area.dragover { border-color: #1e4d7b; background: #eef3f9; }
  .upload-icon { font-size: 40px; margin-bottom: 10px; }
  .upload-area p { color: #5a6a7a; font-size: 14px; margin-bottom: 6px; }
  .upload-area small { color: #9aabbc; font-size: 12px; }
  #fileInput { display: none; }

  .preview-wrap { display: none; text-align: center; }
  .preview-wrap img { max-width: 100%; max-height: 260px; border-radius: 6px; border: 1px solid #e2ded8; }
  .preview-wrap .change-btn { margin-top: 10px; font-size: 12px; color: #1e4d7b; cursor: pointer; text-decoration: underline; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; font-weight: 700; color: #4a5568; }
  .form-group input, .form-group select {
    border: 1px solid #d4d8de; border-radius: 6px; padding: 8px 10px; font-size: 13px;
    outline: none; transition: border 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: #1e4d7b; }

  .inbody-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .inbody-field { display: flex; flex-direction: column; gap: 4px; }
  .inbody-field label { font-size: 11px; font-weight: 700; color: #4a5568; }
  .inbody-field input {
    border: 1px solid #d4d8de; border-radius: 6px; padding: 8px 10px; font-size: 13px;
    outline: none; transition: border 0.2s; background: #fafafa;
  }
  .inbody-field input:focus { border-color: #1e4d7b; background: white; }
  .inbody-field .unit { font-size: 10px; color: #9aabbc; margin-top: 2px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 22px; border-radius: 7px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.2s; }
  .btn-primary { background: #1e4d7b; color: white; }
  .btn-primary:hover { background: #163d62; }
  .btn-secondary { background: #f0a060; color: #1e3a5f; }
  .btn-secondary:hover { background: #e08840; }
  .btn-outline { background: white; color: #1e4d7b; border: 1.5px solid #1e4d7b; }
  .btn-outline:hover { background: #eef3f9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  .ai-btn-area { text-align: center; margin: 10px 0; }
  .ai-btn-area .ai-btn { background: linear-gradient(135deg, #1e4d7b, #c0603a); color: white; padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; font-size: 15px; font-weight: 800; transition: opacity 0.2s; }
  .ai-btn:hover { opacity: 0.88; }
  .ai-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .status { font-size: 13px; color: #5a6a7a; text-align: center; margin-top: 8px; min-height: 20px; }
  .status.error { color: #c0603a; font-weight: 700; }
  .status.success { color: #4a7c59; font-weight: 700; }

  .loading-dots::after { content: ''; animation: dots 1.2s infinite; }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }

  .pdf-preview { width: 100%; height: 600px; border: none; border-radius: 6px; }

  .tip-box { background: #fdf6ec; border-left: 3px solid #d4900a; padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: 12.5px; color: #5a440a; line-height: 1.7; }
  .tip-box strong { color: #9a6208; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
    .inbody-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <div class="logo">ITN <span>피트니스</span></div>
    <div class="sub">동해 · Body Alignment Specialist · 맞춤 운동 루틴 PDF 생성기</div>
  </div>
</div>

<div class="container">

  <!-- STEP 1: 인바디 사진 업로드 -->
  <div class="card">
    <div class="card-header">
      <span class="step-badge">1</span>
      인바디 결과지 사진 업로드
    </div>
    <div class="card-body">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📷</div>
        <p>사진을 여기에 끌어다 놓거나 클릭하여 업로드</p>
        <small>인바디 결과지 사진 · JPG / PNG / HEIC</small>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="인바디 사진">
        <div class="change-btn" id="changeBtn">다른 사진 선택</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">

      <div class="ai-btn-area" style="margin-top:16px">
        <button class="ai-btn" id="extractBtn" disabled>
          ✨ AI 자동 추출
        </button>
        <div class="status" id="extractStatus"></div>
      </div>
    </div>
  </div>

  <!-- STEP 2: 회원 정보 -->
  <div class="card">
    <div class="card-header">
      <span class="step-badge">2</span>
      회원 기본 정보
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="name" placeholder="홍길동">
        </div>
        <div class="form-group">
          <label>나이</label>
          <input type="number" id="age" placeholder="35">
        </div>
        <div class="form-group">
          <label>성별</label>
          <select id="gender">
            <option value="여성">여성</option>
            <option value="남성">남성</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 3: 인바디 수치 -->
  <div class="card">
    <div class="card-header">
      <span class="step-badge">3</span>
      인바디 수치 확인 · 수정
    </div>
    <div class="card-body">
      <div class="tip-box" style="margin-bottom:16px">
        <strong>AI 자동 추출</strong> 후 수치를 확인하고, 잘못된 값이 있으면 직접 수정하세요.
      </div>
      <div class="inbody-grid">
        <div class="inbody-field">
          <label>측정일</label>
          <input type="date" id="measured_at">
          <div class="unit">YYYY-MM-DD</div>
        </div>
        <div class="inbody-field">
          <label>체중</label>
          <input type="number" step="0.1" id="weight" placeholder="65.0">
          <div class="unit">kg</div>
        </div>
        <div class="inbody-field">
          <label>골격근량</label>
          <input type="number" step="0.1" id="muscle_mass" placeholder="24.5">
          <div class="unit">kg</div>
        </div>
        <div class="inbody-field">
          <label>체지방량</label>
          <input type="number" step="0.1" id="body_fat_mass" placeholder="18.0">
          <div class="unit">kg</div>
        </div>
        <div class="inbody-field">
          <label>체지방률</label>
          <input type="number" step="0.1" id="body_fat_pct" placeholder="30.5">
          <div class="unit">%</div>
        </div>
        <div class="inbody-field">
          <label>내장지방레벨</label>
          <input type="number" id="visceral_fat_level" placeholder="9">
          <div class="unit">레벨</div>
        </div>
        <div class="inbody-field">
          <label>BMI</label>
          <input type="number" step="0.1" id="bmi" placeholder="23.5">
          <div class="unit">kg/m²</div>
        </div>
        <div class="inbody-field">
          <label>인바디 점수</label>
          <input type="number" id="inbody_score" placeholder="72">
          <div class="unit">/100점</div>
        </div>
        <div class="inbody-field">
          <label>기초대사량</label>
          <input type="number" id="bmr" placeholder="1380">
          <div class="unit">kcal</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 4: PDF 생성 -->
  <div class="card">
    <div class="card-header">
      <span class="step-badge">4</span>
      운동 루틴 PDF 생성
    </div>
    <div class="card-body">
      <div class="btn-row">
        <button class="btn btn-outline" id="previewBtn">👁 미리보기</button>
        <button class="btn btn-secondary" id="downloadBtn">⬇️ PDF 다운로드</button>
      </div>
      <div class="status" id="pdfStatus"></div>
      <div id="pdfPreviewArea" style="margin-top:16px;display:none">
        <iframe class="pdf-preview" id="pdfFrame"></iframe>
      </div>
    </div>
  </div>

</div>

<script>
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');
  const changeBtn = document.getElementById('changeBtn');
  const extractBtn = document.getElementById('extractBtn');
  const extractStatus = document.getElementById('extractStatus');
  const previewBtn = document.getElementById('previewBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const pdfStatus = document.getElementById('pdfStatus');

  let imageBase64 = null;

  // 드래그 앤 드롭
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
  uploadArea.addEventListener('click', () => fileInput.click());
  changeBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        imageBase64 = canvas.toDataURL('image/jpeg', 0.85);
        previewImg.src = imageBase64;
        uploadArea.style.display = 'none';
        previewWrap.style.display = 'block';
        extractBtn.disabled = false;
        extractStatus.textContent = '사진 업로드 완료. AI 자동 추출을 눌러주세요.';
        extractStatus.className = 'status success';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // AI 추출
  extractBtn.addEventListener('click', async () => {
    if (!imageBase64) return;
    extractBtn.disabled = true;
    extractStatus.className = 'status loading-dots';
    extractStatus.textContent = 'AI가 인바디 수치를 분석하는 중';

    try {
      const res = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageBase64 })
      });
      const json = await res.json();

      if (!json.success) throw new Error(json.error);

      const d = json.data;
      const fields = ['measured_at','weight','muscle_mass','body_fat_mass','body_fat_pct','visceral_fat_level','bmi','inbody_score','bmr'];
      fields.forEach(k => {
        const el = document.getElementById(k);
        if (el && d[k] !== undefined && d[k] !== '') el.value = d[k];
      });

      extractStatus.className = 'status success';
      extractStatus.textContent = '✅ AI 추출 완료! 수치를 확인하고 수정하세요.';
    } catch (err) {
      extractStatus.className = 'status error';
      extractStatus.textContent = '❌ 추출 실패: ' + err.message;
    } finally {
      extractBtn.disabled = false;
    }
  });

  function getMemberData() {
    return {
      name: document.getElementById('name').value || '회원',
      age: document.getElementById('age').value || '',
      gender: document.getElementById('gender').value,
    };
  }

  function getInbodyData() {
    const fields = ['measured_at','weight','muscle_mass','body_fat_mass','body_fat_pct','visceral_fat_level','bmi','inbody_score','bmr'];
    const data = {};
    fields.forEach(k => { data[k] = document.getElementById(k).value || ''; });
    return data;
  }

  // 미리보기
  previewBtn.addEventListener('click', async () => {
    pdfStatus.className = 'status loading-dots';
    pdfStatus.textContent = 'PDF 생성 중';
    document.getElementById('pdfPreviewArea').style.display = 'none';

    try {
      const res = await fetch('/api/preview_pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ member: getMemberData(), inbody: getInbodyData() })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error);

      const iframe = document.getElementById('pdfFrame');
      iframe.src = 'data:application/pdf;base64,' + json.pdf;
      document.getElementById('pdfPreviewArea').style.display = 'block';
      pdfStatus.className = 'status success';
      pdfStatus.textContent = '✅ 미리보기 생성 완료';
    } catch (err) {
      pdfStatus.className = 'status error';
      pdfStatus.textContent = '❌ 오류: ' + err.message;
    }
  });

  // 다운로드
  downloadBtn.addEventListener('click', async () => {
    pdfStatus.className = 'status loading-dots';
    pdfStatus.textContent = 'PDF 다운로드 준비 중';

    try {
      const res = await fetch('/api/generate_pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ member: getMemberData(), inbody: getInbodyData() })
      });

      if (!res.ok) {
        const json = await res.json();
        throw new Error(json.error);
      }

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const name = document.getElementById('name').value || '회원';
      const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
      a.href = url;
      a.download = `ITN_${name}_운동루틴_${today}.pdf`;
      a.click();
      URL.revokeObjectURL(url);

      pdfStatus.className = 'status success';
      pdfStatus.textContent = '✅ PDF 다운로드 완료!';
    } catch (err) {
      pdfStatus.className = 'status error';
      pdfStatus.textContent = '❌ 오류: ' + err.message;
    }
  });
</script>
</body>
</html>
